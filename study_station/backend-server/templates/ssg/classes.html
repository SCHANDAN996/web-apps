{% extends "ssg/layout.html" %}

{% block header %}
<h1>📚 Study <span class="highlight">Materials</span></h1>
<p>Select your class to view all subjects and books.</p>
{% endblock %}

{% block content %}
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; margin-top: 30px;">
    {% for c in classes %}
    <a href="books/ncert/class-{{ c }}/index.html" style="background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 16px; padding: 30px 20px; text-align: center; text-decoration: none; color: var(--text-primary); transition: all 0.3s ease; display: block;">
        <div style="font-size: 3rem; margin-bottom: 15px; color: var(--primary-light);"><ion-icon name="school-outline"></ion-icon></div>
        <div style="font-size: 1.5rem; font-weight: bold;">Class {{ c }}</div>
    </a>
    {% endfor %}
</div>
{% endblock %}
