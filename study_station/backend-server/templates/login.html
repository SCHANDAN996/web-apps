<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Admin Login — Study Station</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-50 flex items-center justify-center px-4 font-sans text-gray-800">
    <form method="POST" class="w-full max-w-sm bg-white border rounded-2xl shadow-sm p-8 space-y-5">
        <div>
            <h1 class="text-xl font-bold text-purple-800">Study Station Admin</h1>
            <p class="text-sm text-gray-500 mt-1">Enter the admin password to continue.</p>
        </div>
        {% if error %}
        <div class="text-sm bg-red-50 text-red-700 border border-red-200 rounded-lg px-3 py-2" role="alert">{{ error }}</div>
        {% endif %}
        <label class="block">
            <span class="text-sm font-medium">Password</span>
            <input type="password" name="password" required autofocus autocomplete="current-password"
                   class="mt-1 w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-purple-500">
        </label>
        <button type="submit" class="w-full bg-purple-700 hover:bg-purple-800 text-white font-semibold rounded-lg py-2.5 focus:outline-none focus-visible:ring-2 focus-visible:ring-purple-400 focus-visible:ring-offset-2">Log in</button>
    </form>
</body>
</html>
