<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Station Admin</title>
    <!-- Tailwind CSS (Hostinger Style inspiration) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#673AB7', // Deep Purple
                        secondary: '#4527A0',
                        bglight: '#F8F9FA'
                    }
                }
            }
        }
    </script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-bglight font-sans text-gray-800">
    <div class="flex h-screen overflow-hidden">
        
        <!-- Sidebar -->
        <aside class="w-64 bg-white border-r shadow-sm flex flex-col">
            <div class="h-16 flex items-center px-6 border-b">
                <span class="text-xl font-bold text-primary"><i class="fas fa-graduation-cap mr-2"></i>Study Station</span>
            </div>
            
            <nav class="flex-1 px-4 py-6 space-y-2">
                <a href="/admin" class="flex items-center px-4 py-3 bg-primary text-white rounded-lg font-medium transition-colors">
                    <i class="fas fa-home w-5"></i> Dashboard
                </a>
                <a href="/admin/study" class="flex items-center px-4 py-3 text-gray-600 hover:bg-gray-100 rounded-lg font-medium transition-colors">
                    <i class="fas fa-book w-5"></i> Study Materials
                </a>
                <a href="#" class="flex items-center px-4 py-3 text-gray-600 hover:bg-gray-100 rounded-lg font-medium transition-colors">
                    <i class="fas fa-tasks w-5"></i> Practice Sets
                </a>
                <a href="#" class="flex items-center px-4 py-3 text-gray-600 hover:bg-gray-100 rounded-lg font-medium transition-colors">
                    <i class="fas fa-briefcase w-5"></i> Job Alerts
                </a>
                <a href="/admin/automation" class="flex items-center px-4 py-3 text-gray-600 hover:bg-gray-100 rounded-lg font-medium transition-colors">
                    <i class="fas fa-robot w-5"></i> AI Auto Scraper
                </a>
                <a href="/admin/settings" class="flex items-center px-4 py-3 text-gray-600 hover:bg-gray-100 rounded-lg font-medium transition-colors">
                    <i class="fas fa-cog w-5"></i> Settings
                </a>
            </nav>
            
            <div class="p-4 border-t">
                <form method="POST" action="/admin/logout">
                    <button type="submit" class="flex items-center px-4 py-2 text-gray-600 hover:text-red-500 transition-colors">
                        <i class="fas fa-sign-out-alt w-5"></i> Logout
                    </button>
                </form>
            </div>
        </aside>

        <!-- Main Content -->
        <div class="flex-1 flex flex-col overflow-hidden">
            <!-- Header -->
            <header class="h-16 bg-white border-b shadow-sm flex items-center justify-between px-8">
                <h1 class="text-xl font-semibold">{% block header_title %}Admin Panel{% endblock %}</h1>
                <div class="flex items-center space-x-4">
                    <button class="text-gray-500 hover:text-primary"><i class="fas fa-bell"></i></button>
                    <div class="h-8 w-8 rounded-full bg-primary text-white flex items-center justify-center font-bold">
                        A
                    </div>
                </div>
            </header>

            <!-- Main Scrollable Area -->
            <main class="flex-1 overflow-x-hidden overflow-y-auto bg-bglight p-8">
                {% block content %}{% endblock %}
            </main>
        </div>
    </div>
</body>
</html>
