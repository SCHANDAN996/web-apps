# /etc/rsyslog.d/00-studystation-nginx.conf
# Dedicated socket bypasses journald; raw events never enter generic rules.
# Debian/Ubuntu already load imuxsock in /etc/rsyslog.conf.
template(name="ss_nginx_unsafe" type="string"
         string="%timegenerated% %HOSTNAME% %syslogtag% Study Station nginx: OAuth callback /api/v1/classroom/google/callback error; query-bearing detail suppressed\n")
ruleset(name="ss_nginx_sanitized") {
    # Native fail-closed branch: never format query-bearing callback messages.
    if re_match($msg, "/api/v1/classroom/google/callback([?]|%3[Ff])") then {
        action(type="omfile" file="/var/log/studystation-nginx-errors.log"
               template="ss_nginx_unsafe")
    } else {
        action(type="omfile" file="/var/log/studystation-nginx-errors.log"
               template="RSYSLOG_TraditionalFileFormat")
    }
    stop
}

input(type="imuxsock" Socket="/var/spool/rsyslog/studystation-nginx-log.sock"
      CreatePath="on" Ruleset="ss_nginx_sanitized")
