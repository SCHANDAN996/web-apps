# Run only through studystation-retention.service, not global /etc/logrotate.d.
# Replaces the previous studystation-oauth-errors config. copytruncate retains
# writer descriptors (small concurrent-write loss is the standard tradeoff).
/var/log/studystation/*.log /var/log/studystation-nginx-errors.log /var/log/nginx/studystation-access.log {
    su root root
    hourly
    rotate 336
    maxage 13
    missingok
    notifempty
    copytruncate
    nocompress
    nodateext
}
