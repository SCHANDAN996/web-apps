# /etc/nginx/sites-available/studystation  →  ln -s to sites-enabled, then: certbot --nginx -d studystation.in -d www.studystation.in
limit_req_zone $binary_remote_addr zone=ss_api:10m rate=10r/s;

server {
    listen 80;
    server_name studystation.in www.studystation.in;
    return 301 https://studystation.in$request_uri;
}

server {
    listen 443 ssl http2;
    server_name studystation.in;
    # ssl_certificate / ssl_certificate_key lines are added by certbot

    client_max_body_size 1m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;

    location /static/ {
        alias /var/www/study_station/v2/app/static/;
        expires 1d;
        access_log off;
    }

    location /api/ {
        limit_req zone=ss_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:8001;
        include /etc/nginx/proxy_params;
    }

    location / {
        proxy_pass http://127.0.0.1:8001;
        include /etc/nginx/proxy_params;
        proxy_read_timeout 60s;
    }
}
