# /etc/nginx/sites-available/studystation  â†’  ln -s to sites-enabled, then: certbot --nginx -d studystation.in -d www.studystation.in
# http-context safe format: omit request args and Referer (may contain OAuth codes).
# Keep client address, method, URI, protocol, status, bytes and timings.
log_format ss_safe '$remote_addr - $remote_user [$time_local] '
                   '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                   'rt=$request_time upstream=$upstream_status urt=$upstream_response_time';
limit_req_zone $binary_remote_addr zone=ss_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=ss_login:1m rate=5r/m;

map $arg_v $ss_static_cache {
    ""      "public, max-age=86400";
    default "public, max-age=31536000, immutable";
}

server {
    # Enable only after the sanitizer is installed; see deploy/OAUTH_LOGGING.md.
    access_log /var/log/nginx/studystation-access.log ss_safe;
    error_log syslog:server=unix:/var/spool/rsyslog/studystation-nginx-log.sock,tag=studystation_nginx,nohostname error;
    listen 80;
    server_name studystation.in www.studystation.in;
    return 301 https://studystation.in$request_uri;
}

server {
    # Enable only after the sanitizer is installed; see deploy/OAUTH_LOGGING.md.
    access_log /var/log/nginx/studystation-access.log ss_safe;
    error_log syslog:server=unix:/var/spool/rsyslog/studystation-nginx-log.sock,tag=studystation_nginx,nohostname error;
    listen 443 ssl http2;
    server_name studystation.in;
    # ssl_certificate / ssl_certificate_key lines are added by certbot

    client_max_body_size 2m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;

    location /static/ {
        alias /var/www/study_station/v2/app/static/;
        # Pages link assets as /static/x?v=<hash of the files>: cache those for a year, others for a day.
        add_header Cache-Control $ss_static_cache always;
        # a location-level add_header drops the server-level ones, so repeat them here
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        access_log off;
    }

    location = /admin/login {
        limit_req zone=ss_login burst=3 nodelay;
        proxy_pass http://127.0.0.1:8001;
        include /etc/nginx/proxy_params;
    }

    location /api/ {
        limit_req zone=ss_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:8001;
        include /etc/nginx/proxy_params;
    }

    location / {
        proxy_pass http://127.0.0.1:8001;
        include /etc/nginx/proxy_params;
        proxy_read_timeout 60s;
    }
}
