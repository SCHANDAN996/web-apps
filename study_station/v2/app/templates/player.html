{% extends 'base.html' %}
{% block title %}{{ attempt.title }} — {{ tr('brand') }}{% endblock %}
{% block robots %}<meta name="robots" content="noindex">{% endblock %}
{% block body_class %}{{ 'cbt' if attempt.mode == 'mock' else 'player-open' }}{% endblock %}
{% block main %}
<div id="player" class="player" data-attempt="{{ attempt.id }}" data-mode="{{ attempt.mode }}">
  <div class="empty" aria-live="polite">…</div>
</div>
{% endblock %}
{% block scripts %}<script src="/static/js/player.js?v={{ asset_v }}" defer></script>{% endblock %}
