ion links follow the destination website\u2019s privacy policy. The app does not include advertising identifiers or advertising tracking. Server security logs may contain IP addresses and request information to operate the service and prevent abuse.", "privacy_external_title": "External links and security", "privacy_intro": "Study Station is a study, practice and collaborative learning app. It is not an official government app.", "privacy_learning": "Private offline notebooks, rough work and offline learning data stay on your phone. Online study may store a device identifier, answers, tests and progress on our server. Workspaces, class work, answers and messages you explicitly share or submit are stored on the server and made available according to the group, teacher or link permissions. Private notebooks are not automatically shared. Community safety stores your accepted rules version, block list, report details, a protected copy of reported content, and reporter and content-owner identifiers on the server. Reports are visible only to moderators. Account deletion removes its identifiers, report details and saved evidence; anonymous moderation decision records may remain.", "privacy_learning_title": "Learning and shared work", "privacy_membership": "When membership is enabled, the server stores trial activation, its 3-calendar-month end and paid-access expiry against your opaque account identifier. The server determines the time. If daily offline checking is enabled, the app obtains a signed proof over the internet valid for at most 24 hours, never beyond trial or paid-access expiry. The opaque account identifier and proof stay in private app storage on the phone. The check does not automatically upload your private notebooks or rough work. Signing out clears the phone proof; account deletion removes server membership records. There is no automatic charge.", "privacy_membership_title": "Trial and offline membership", "privacy_payment": "Where PayU website checkout i
