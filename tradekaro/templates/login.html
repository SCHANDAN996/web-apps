<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TradeKaro — Login</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      background: #0d1117; color: #e6edf3;
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    form {
      width: 100%; max-width: 340px; padding: 32px;
      background: #161b22; border: 1px solid #30363d; border-radius: 10px;
    }
    h1 { margin: 0 0 4px; font-size: 20px; }
    p.sub { margin: 0 0 24px; color: #8b949e; font-size: 13px; }
    label { display: block; margin-bottom: 6px; font-size: 13px; color: #8b949e; }
    input {
      width: 100%; padding: 10px 12px; margin-bottom: 16px;
      background: #0d1117; color: #e6edf3;
      border: 1px solid #30363d; border-radius: 6px; font-size: 15px;
    }
    input:focus { outline: none; border-color: #2f81f7; }
    button {
      width: 100%; padding: 10px; border: 0; border-radius: 6px;
      background: #238636; color: #fff; font-size: 15px; font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #2ea043; }
    .error {
      margin-bottom: 16px; padding: 10px 12px; border-radius: 6px;
      background: #3d1418; border: 1px solid #6e2731; color: #ff9d9d;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <form method="post" autocomplete="off">
    <h1>TradeKaro</h1>
    <p class="sub">Trading dashboard</p>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <label for="password">Password</label>
    <input type="password" id="password" name="password" autofocus required>
    <button type="submit">Log in</button>
  </form>
</body>
</html>
