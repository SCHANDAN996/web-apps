{% extends "base.html" %}
{% block title %}Settings{% endblock %}
{% block page_title %}<i class="fa-solid fa-sliders text-cyan"></i> Settings{% endblock %}

{% block content %}
<div x-data="settingsPage()" x-init="init()" class="animate-fade-in" style="max-width:900px;">

    <!-- ═══ Risk Configuration ═══ -->
    <div class="glass-card mb-4">
        <div class="section-header">
            <div class="section-title"><i class="fa-solid fa-shield-halved text-loss"></i> Risk Configuration</div>
        </div>
        <div class="grid grid-2 gap-4">
            <div>
                <label class="card-label" style="margin-bottom:8px;display:block;">Max Daily Loss (₹)</label>
                <input class="input" type="number" x-model="risk.max_loss" @change="saveRisk()">
                <div class="text-muted" style="font-size:9px;margin-top:4px;text-align:right;">Hard Stop Trigger</div>
            </div>
            <div>
                <label class="card-label" style="margin-bottom:8px;display:block;">Stop Loss %</label>
                <input class="input" type="number" step="0.1" x-model="risk.sl_pct" @change="saveRisk()">
                <div class="text-muted" style="font-size:9px;margin-top:4px;text-align:right;">Per Trade Risk</div>
            </div>
        </div>
    </div>

    <!-- ═══ Data Control ═══ -->
    <div class="glass-card mb-4">
        <div class="section-header">
            <div class="section-title"><i class="fa-solid fa-server text-purple"></i> Data Control</div>
            <button class="btn btn-ghost" @click="forceSync()"><i class="fa-solid fa-bolt"></i> Sync Now</button>
        </div>

        <!-- Mode -->
        <div class="grid grid-2 gap-3 mb-4">
            <button class="btn" :class="mode === 'LIVE' ? 'btn-success' : 'btn-ghost'" @click="mode='LIVE'; saveData()">
                <i class="fa-solid fa-satellite-dish"></i> LIVE
            </button>
            <button class="btn" :class="mode === 'EOD' ? 'btn-primary' : 'btn-ghost'" @click="mode='EOD'; saveData()">
                <i class="fa-solid fa-moon"></i> EOD
            </button>
        </div>

        <!-- Subscriptions -->
        <template x-for="(items, category) in available" :key="category">
            <div style="margin-bottom:12px;border:1px solid var(--border-subtle);border-radius:var(--radius-sm);overflow:hidden;">
                <div class="flex justify-between items-center" style="padding:10px 14px;background:var(--bg-card);cursor:pointer;" @click="expanded[category] = !expanded[category]">
                    <div class="flex items-center gap-3">
                        <input type="checkbox" :checked="isAllSelected(category)" @change.stop="toggleAll(category)" style="accent-color:var(--neon-purple);">
                        <span class="font-mono font-bold text-xs" style="color:var(--text-primary);" x-text="category"></span>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="text-muted" style="font-size:10px;" x-text="countEnabled(category) + ' active'"></span>
                        <i class="fa-solid fa-chevron-down text-muted" style="font-size:10px;transition:transform var(--transition-fast);" :style="expanded[category] ? 'transform:rotate(180deg)' : ''"></i>
                    </div>
                </div>
                <div x-show="expanded[category]" x-cloak class="grid grid-3" style="padding:8px;gap:4px;">
                    <template x-for="sym in items" :key="sym">
                        <label class="flex items-center gap-2" style="padding:4px 8px;border-radius:var(--radius-sm);cursor:pointer;font-size:10px;font-family:var(--font-mono);color:var(--text-secondary);">
                            <input type="checkbox" :checked="isSubscribed(category, sym)" @change="toggleSub(category, sym)" style="accent-color:var(--neon-purple);">
                            <span x-text="sym"></span>
                        </label>
                    </template>
                </div>
            </div>
        </template>
    </div>

    <!-- ═══ System Health ═══ -->
    <div class="glass-card">
        <div class="section-header">
            <div class="section-title"><i class="fa-solid fa-heartbeat text-cyan"></i> System Health</div>
            <button class="btn btn-ghost" @click="checkHealth()"><i class="fa-solid fa-stethoscope"></i> Check</button>
        </div>
        <div class="grid grid-2 gap-3">
            <template x-for="mod in modules" :key="mod.name">
                <div class="flex items-center gap-3" style="background:var(--bg-card);padding:10px 14px;border-radius:var(--radius-sm);border:1px solid var(--border-subtle);">
                    <span class="status-dot" :class="mod.ok ? 'live' : 'offline'"></span>
                    <div style="flex:1;min-width:0;">
                        <div class="font-mono text-xs font-bold" style="color:var(--text-primary);" x-text="mod.name"></div>
                        <div class="text-muted truncate" style="font-size:9px;" x-text="mod.status"></div>
                    </div>
                </div>
            </template>
        </div>
    </div>
</div>

<script>
function settingsPage() {
    return {
        risk: { max_loss: 5000, sl_pct: 1.0 },
        mode: 'LIVE',
        available: {},
        subscriptions: {},
        expanded: {},
        modules: [],

        init() {
            this.loadRisk(); this.loadData(); this.checkHealth();
        },

        async loadRisk() {
            const data = await smartFetch('/api/risk_config', null);
            if (data) this.risk = data;
        },
        async saveRisk() {
            try { await fetch('/api/risk_config', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(this.risk) }); } catch (e) {}
        },

        async loadData() {
            const [avail, config] = await Promise.all([
                smartFetch('/api/available_symbols', {}),
                smartFetch('/api/data_config', {})
            ]);
            if (avail) this.available = avail;
            if (config.fetch_mode) this.mode = config.fetch_mode;
            if (config.subscriptions) this.subscriptions = config.subscriptions;
        },
        async saveData() {
            try { await fetch('/api/data_config', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ fetch_mode: this.mode, subscriptions: this.subscriptions }) }); } catch (e) {}
        },
        async forceSync() {
            fetch('/api/force_sync', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
        },

        isSubscribed(cat, sym) { if (!this.subscriptions[cat]) return true; return this.subscriptions[cat][sym] !== false; },
        toggleSub(cat, sym) { if (!this.subscriptions[cat]) this.subscriptions[cat] = {}; this.subscriptions[cat][sym] = !this.isSubscribed(cat, sym); this.saveData(); },
        isAllSelected(cat) { if (!this.available[cat]) return false; return this.available[cat].every(s => this.isSubscribed(cat, s)); },
        toggleAll(cat) { if (!this.subscriptions[cat]) this.subscriptions[cat] = {}; const t = !this.isAllSelected(cat); this.available[cat].forEach(s => { this.subscriptions[cat][s] = t; }); this.saveData(); },
        countEnabled(cat) { if (!this.available[cat]) return 0; return this.available[cat].filter(s => this.isSubscribed(cat, s)).length; },

        async checkHealth() {
            const data = await smartFetch('/api/module-health', []);
            if (Array.isArray(data)) {
                this.modules = data;
            } else {
                this.modules = [
                    { name: 'Brain Engine', ok: true, status: 'GRU v4 Active' },
                    { name: 'Data Engine', ok: true, status: 'Fetching' },
                    { name: 'Connector', ok: true, status: 'Shoonya API' },
                    { name: 'Database', ok: true, status: 'SQLite WAL' },
                    { name: 'Socket Server', ok: true, status: 'SocketIO Active' },
                    { name: 'Trainer', ok: false, status: 'Idle' }
                ];
            }
        }
    }
}
</script>
{% endblock %}
