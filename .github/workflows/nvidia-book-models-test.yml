name: Hindi direct-writing model comparison
on:
  push:
    branches: ['codex/hindi-direct-compare-20261117']
permissions:
  contents: read
  statuses: write
jobs:
  sample:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        candidate:
          - {label: ultra, model: nvidia/nemotron-3-ultra-550b-a55b}
          - {label: deepseek, model: deepseek-ai/deepseek-v4.1-flash}
        key:
          - {label: key3, secret: NVIDIA_API_KEY_3}
          - {label: key4, secret: NVIDIA_API_KEY_4}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate small Hindi lesson and verify one factual MCQ
        id: sample
        env:
          API_KEY: ${{ secrets[matrix.key.secret] }}
          MODEL: ${{ matrix.candidate.model }}
          MODEL_LABEL: ${{ matrix.candidate.label }}
        shell: python
        run: |
          import json, os, re, signal, time, urllib.request, urllib.error
          def expired(signum, frame):
              raise TimeoutError()
          signal.signal(signal.SIGALRM, expired)
          key, model = os.environ.get('API_KEY', '').strip(), os.environ['MODEL']
          result, sample = 'secret_missing', None
          started = time.monotonic()
          if key:
              prompt = "प्रतियोगी परीक्षा की हिंदी पुस्तक के लेखक की तरह सीधे सहज देवनागरी हिंदी में लिखें। अंग्रेज़ी से अनुवाद नहीं। केवल वैध JSON दें: lesson_hi (संज्ञा और सर्वनाम का 180–250 शब्दों का मौलिक पाठ: परिभाषा, भेद, उदाहरण और परीक्षा की सामान्य भूल), questions (ठीक छह MCQ), memory_tip_hi (संक्षिप्त स्मरण सूत्र)। प्रत्येक MCQ में id (1–6), target, question_hi, options_hi (चार अलग विकल्प), answer_index (0–3), solution_hi (सही उत्तर और एक गलत विकल्प का कारण) हों। क्रमशः इन शब्दों का व्याकरणिक वर्ग पूछें: 1 राम, 2 वह, 3 सुंदरता, 4 गंगा, 5 हम, 6 मिठास। वर्गों में व्यक्तिवाचक संज्ञा, भाववाचक संज्ञा, जातिवाचक संज्ञा और सर्वनाम का सही उपयोग करें। लक्ष्य शब्द और मात्राएँ जस की तस रखें। उत्तरों की स्थितियाँ मिलाएँ। PYQ या परीक्षा-वर्ष का दावा न करें। प्रश्न पाठ से मेल खाएँ।"
              payload = {'model': model, 'messages': [{'role':'user','content':prompt}],
                         'max_tokens':4000, 'temperature':0.2, 'stream':True}
              if os.environ['MODEL_LABEL'] == 'ultra':
                  payload['chat_template_kwargs'] = {'enable_thinking':False}
              else:
                  payload['reasoning_effort'] = 'low'
              request = urllib.request.Request('https://integrate.api.nvidia.com/v1/chat/completions',
                  json.dumps(payload).encode(), {'Authorization':'Bearer '+key, 'Content-Type':'application/json',
                                                'Accept':'text/event-stream'})
              signal.alarm(120)
              try:
                  parts, total, finish = [], 0, None
                  with urllib.request.urlopen(request,timeout=90) as response:
                      for raw in response:
                          total += len(raw)
                          if total > 262144:
                              raise ValueError()
                          line = raw.decode('utf-8','replace').strip()
                          if not line.startswith('data:'):
                              continue
                          data = line[5:].strip()
                          if data == '[DONE]':
                              break
                          choices = json.loads(data).get('choices',[])
                          if choices:
                              parts.append((choices[0].get('delta') or {}).get('content') or '')
                              finish = choices[0].get('finish_reason') or finish
                  text = ''.join(parts).strip()
                  if not text:
                      result = 'http200_no_final_text'
                  elif finish == 'length':
                      result = 'output_token_limit'
                  else:
                      try:
                          clean = re.sub(r'^\x60\x60\x60(?:json)?\s*|\s*\x60\x60\x60$', '', text)
                          obj = json.loads(clean)
                          expected = ['व्यक्तिवाचक संज्ञा','सर्वनाम','भाववाचक संज्ञा','व्यक्तिवाचक संज्ञा','सर्वनाम','भाववाचक संज्ञा']
                          targets = ['राम','वह','सुंदरता','गंगा','हम','मिठास']
                          qs = obj.get('questions', [])
                          checks = []
                          for i, q in enumerate(qs):
                              opts = q.get('options_hi', [])
                              a = q.get('answer_index')
                              checks.append(i < 6 and q.get('id') == i+1 and q.get('target') == targets[i]
                                  and len(opts) == 4 and len(set(opts)) == 4 and type(a) is int and 0 <= a < 4
                                  and opts[a].strip() == expected[i] and targets[i] in q.get('question_hi','')
                                  and bool(q.get('solution_hi','').strip()))
                          valid = (isinstance(obj,dict) and isinstance(obj.get('lesson_hi'),str)
                              and len(obj['lesson_hi'].split()) >= 140 and len(qs) == 6 and all(checks)
                              and bool(obj.get('memory_tip_hi','').strip()))
                          print('CHECKS_JSON='+json.dumps({'mcq_checks':checks,'lesson_words':len(obj.get('lesson_hi','').split()),'finish':finish}),flush=True)
                          sample = obj
                          result = 'sample_pass' if valid else 'sample_check_failed'
                          if valid:
                              sample = obj
                      except (ValueError,TypeError,KeyError):
                          result = 'text_received_invalid_json'
              except urllib.error.HTTPError as error:
                  result = 'http_'+str(error.code)
              except (urllib.error.URLError,TimeoutError,OSError):
                  result = 'network_or_timeout'
              except Exception:
                  result = 'invalid_response'
              finally:
                  signal.alarm(0)
          elapsed = round(time.monotonic()-started,1)
          print('RESULT='+result+'; seconds='+str(elapsed),flush=True)
          if sample:
              print('SAMPLE_JSON='+json.dumps(sample,ensure_ascii=False),flush=True)
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              output.write('result='+result+'\nstate='+('success' if result=='sample_pass' else 'failure')+'\n')
      - name: Record safe model result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT_STATE: ${{ steps.sample.outputs.state }}
          RESULT: ${{ steps.sample.outputs.result }}
          MODEL_LABEL: ${{ matrix.candidate.label }}
          KEY_LABEL: ${{ matrix.key.label }}
        run: |
          gh api --silent --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="${RESULT_STATE:-error}" -f context="hindi-pilot-$MODEL_LABEL-$KEY_LABEL" \
            -f description="${RESULT:-incomplete}" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          test "$RESULT_STATE" = success
