name: NVIDIA keys 5 and 6 availability
on:
  push:
    branches: ['codex/nvidia-keys56-smoke-20261120']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check four distinct active key secrets
        env:
          ACTIVE_THREE: ${{ secrets.NVIDIA_API_KEY_3 }}
          ACTIVE_FOUR: ${{ secrets.NVIDIA_API_KEY_4 }}
          ACTIVE_FIVE: ${{ secrets.NVIDIA_API_KEY_5 }}
          ACTIVE_SIX: ${{ secrets.NVIDIA_API_KEY_6 }}
        shell: python
        run: |
          import os, json
          names = ['ACTIVE_THREE','ACTIVE_FOUR','ACTIVE_FIVE','ACTIVE_SIX']
          values = [os.environ.get(name,'').strip() for name in names]
          configured = [bool(value) for value in values]
          distinct = len(set(values)) == 4
          print('POOL_CHECK='+json.dumps({'configured':configured,'four_distinct':distinct}),flush=True)
          if not all(configured) or not distinct:
              raise SystemExit(1)
