# Study Station book autopilot — writes/repairs book chapters with the NVIDIA API around the clock.
# Each run works ~5 hours on the books branch: bookgen writes, an independent model re-solves every
# practice set and reviews every section, and a chapter is pushed only when bookcheck is OK.
# Live progress: study_station/books/AUTOPILOT_STATUS.md on the books branch.
# Needs the repository secret NVIDIA_API_KEY (Settings → Secrets and variables → Actions).
name: Book autopilot

on:
  schedule:
    - cron: '17 * * * *'           # hourly: a lane still running keeps going, the next run waits in line (per-lane concurrency), so no lane sits idle
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  write-books:
    # Five lanes run side by side on different books (no two lanes touch the same chapter);
    # each lane keeps its own status page so their pushes never conflict.
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: lane-1
            books: Graduation_Level/English Graduation_Level/Reasoning
            status: AUTOPILOT_STATUS.md
          - lane: lane-2
            books: Graduation_Level/GK Graduation_Level/Maths
            status: autopilot/lane-2.md
          - lane: lane-3
            books: 12th_Level/English 12th_Level/Reasoning
            status: autopilot/lane-3.md
          - lane: lane-4
            books: 12th_Level/GK 12th_Level/Maths
            status: autopilot/lane-4.md
          - lane: lane-5
            books: 10th_Level/English 10th_Level/Maths
            status: autopilot/lane-5.md
    concurrency:
      group: book-autopilot-${{ matrix.lane }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      BOOKS_BRANCH: claude/elegant-rubin-sgov1q
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BOOKS_BRANCH }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: study_station/v2/requirements.txt
      - name: Install
        run: pip install -r study_station/v2/requirements.txt
      # Unfinished chapters survive between runs: their sections are cached per lane and restored here.
      - name: Restore unfinished work
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/wip.tar.gz
          key: wip-${{ matrix.lane }}-${{ github.run_id }}
          restore-keys: wip-${{ matrix.lane }}-
      - name: Unpack unfinished work
        run: |
          if [ -f "$RUNNER_TEMP/wip.tar.gz" ]; then
            tar -xzf "$RUNNER_TEMP/wip.tar.gz" --skip-old-files && echo "restored $(tar -tzf "$RUNNER_TEMP/wip.tar.gz" | wc -l) files"
          fi
      - name: Check the key is set
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          if [ -z "$NVIDIA_API_KEY" ]; then
            echo "::error::Repository secret NVIDIA_API_KEY is missing (Settings → Secrets and variables → Actions)."
            exit 1
          fi
      - name: Write books (${{ matrix.lane }})
        working-directory: study_station/v2
        timeout-minutes: 325           # step limit (not the job's) so the unfinished work is still packed
        env:
          # a second key (optional secret NVIDIA_API_KEY_2) is shared out over the workers
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }},${{ secrets.NVIDIA_API_KEY_2 }}
          BOOKGEN_REJECT_DIR: ${{ runner.temp }}/rejects
          PYTHONUNBUFFERED: '1'
        run: |
          git config user.name "study-station-book-autopilot"
          git config user.email "211449723+SCHANDAN996@users.noreply.github.com"
          mkdir -p ../books/autopilot
          python tools/book_autopilot.py --workers 5 --reverse --only ${{ matrix.books }} \
            --name "${{ matrix.lane }}" --status-file "${{ matrix.status }}" \
            --branch "$BOOKS_BRANCH" --state-dir "$RUNNER_TEMP/autopilot" --stop-new-after 240
      - name: Pack unfinished work
        if: always()
        run: |
          git ls-files --others --exclude-standard -z -- study_station/books ':!study_station/books/autopilot' \
            | tar --null -czf "$RUNNER_TEMP/wip.tar.gz" -T - && echo "packed $(tar -tzf "$RUNNER_TEMP/wip.tar.gz" | wc -l) files"
      - name: Save unfinished work
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/wip.tar.gz
          key: wip-${{ matrix.lane }}-${{ github.run_id }}
      - name: Keep the log and rejected outputs for diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autopilot-${{ matrix.lane }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/autopilot/log.txt
            ${{ runner.temp }}/rejects
          if-no-files-found: ignore
          retention-days: 7
