# Study Station book autopilot — writes/repairs book chapters with the NVIDIA API around the clock.
# Each run works ~5 hours on the books branch: bookgen writes, two blind Ultra requests re-solve every
# practice set and reviews every section, and a chapter is pushed only when bookcheck is OK.
# Live progress: study_station/books/AUTOPILOT_STATUS.md on the books branch.
# Active pool: NVIDIA_API_KEY_3 and NVIDIA_API_KEY_4 only; keys 1 and 2 are temporarily disabled.
name: Book autopilot

on:
  schedule:
    - cron: '17 * * * *'           # hourly: a lane still running keeps going, the next run waits in line (per-lane concurrency), so no lane sits idle
  workflow_dispatch: {}
  push:
    branches: ['claude/elegant-rubin-sgov1q']
    paths: ['.github/workflows/book-autopilot.yml']

permissions:
  contents: write
  actions: write                   # the last job starts the next run, so the lanes never sit idle

jobs:
  write-books:
    # All writer runs share the default-branch cache scope, including canonical push triggers.
    if: github.ref == 'refs/heads/main'
    # One run owns the queue; four chapters share two in-flight API slots and one account throttle.
    # Keep the existing concurrency group so old and new runs never overlap.
    concurrency:
      group: book-autopilot-two-chapters
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      BOOKS_BRANCH: claude/elegant-rubin-sgov1q
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BOOKS_BRANCH }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: study_station/v2/requirements.txt
      - name: Install
        run: pip install -r study_station/v2/requirements.txt
      # Unfinished chapters survive between runs: their sections are cached per lane and restored here.
      - name: Restore unfinished work
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/wip.tar.gz
          key: wip-two-chapters-${{ github.run_id }}
          restore-keys: wip-two-chapters-
      - name: Unpack unfinished work
        run: |
          if [ -f "$RUNNER_TEMP/wip.tar.gz" ]; then
            tar -xzf "$RUNNER_TEMP/wip.tar.gz" --skip-old-files && echo "restored $(tar -tzf "$RUNNER_TEMP/wip.tar.gz" | wc -l) files"
          fi
      - name: Check active keys are set
        env:
          NVIDIA_API_KEY_3: ${{ secrets.NVIDIA_API_KEY_3 }}
          NVIDIA_API_KEY_4: ${{ secrets.NVIDIA_API_KEY_4 }}
        shell: python
        run: |
          import os
          names = ('NVIDIA_API_KEY_3', 'NVIDIA_API_KEY_4')
          if not any(os.environ.get(name, '').strip() for name in names):
              raise SystemExit('Configure NVIDIA_API_KEY_3 or NVIDIA_API_KEY_4; keys 1 and 2 are disabled.')
      - name: Write books (four-chapters)
        working-directory: study_station/v2
        timeout-minutes: 325           # step limit (not the job's) so the unfinished work is still packed
        env:
          # Hindi subject: Hindi-only writer/checkers/reviewer; no English translation.
          # Only keys 3 and 4; all roles Ultra, four chapter workers, bounded account/key throttling.
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY_3 }},${{ secrets.NVIDIA_API_KEY_4 }}
          NVIDIA_API_KEY_LABELS: '3,4'
          BOOKGEN_REJECT_DIR: ${{ runner.temp }}/rejects
          NVIDIA_MODEL: nvidia/nemotron-3-ultra-550b-a55b
          NVIDIA_CHECK_MODEL: nvidia/nemotron-3-ultra-550b-a55b
          NVIDIA_FALLBACK_MODELS: nvidia/nemotron-3-ultra-550b-a55b
          BOOKGEN_RATE_STATE_DIR: ${{ runner.temp }}/autopilot/rate
          NVIDIA_MIN_INTERVAL_SECONDS: '15'
          NVIDIA_ACCOUNT_MIN_INTERVAL_SECONDS: '20'
          NVIDIA_MAX_INFLIGHT_PER_KEY: '1'
          BOOKGEN_RATE_POLICY: parallel-v2
          PYTHONUNBUFFERED: '1'
        run: |
          git config user.name "study-station-book-autopilot"
          git config user.email "211449723+SCHANDAN996@users.noreply.github.com"
          mkdir -p ../books/autopilot
          python tools/book_autopilot.py --workers 4 --max-fails 4 \
            --name "four-chapters" --status-file "AUTOPILOT_STATUS.md" \
            --branch "$BOOKS_BRANCH" --state-dir "$RUNNER_TEMP/autopilot" --stop-new-after 240
      - name: Pack unfinished work
        if: always()
        run: |
          git ls-files --others --exclude-standard -z -- study_station/books ':!study_station/books/autopilot' \
            | tar --null -czf "$RUNNER_TEMP/wip.tar.gz" -T - && echo "packed $(tar -tzf "$RUNNER_TEMP/wip.tar.gz" | wc -l) files"
      - name: Save unfinished work
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/wip.tar.gz
          key: wip-two-chapters-${{ github.run_id }}
      - name: Keep the log and rejected outputs for diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autopilot-four-chapters-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/autopilot/log.txt
            ${{ runner.temp }}/rejects
          if-no-files-found: ignore
          retention-days: 7

  # GitHub often skips hourly cron runs, so a run that found work starts the next one itself. A run that ended
  # within 20 minutes had nothing left it could do; then only the hourly cron tries again (no endless loop).
  next-run:
    needs: write-books
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Start the next autopilot run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$GITHUB_REF_NAME" != main ]; then
            gh workflow run book-autopilot.yml --repo "$REPO" --ref main
            exit 0
          fi
          started=$(gh run view "${{ github.run_id }}" --repo "$REPO" --json startedAt -q .startedAt)
          minutes=$(( ( $(date +%s) - $(date -d "$started" +%s) ) / 60 ))
          echo "this run took $minutes minutes"
          if [ "$minutes" -lt 20 ]; then echo "nothing left to do — waiting for the hourly cron"; exit 0; fi
          gh workflow run book-autopilot.yml --repo "$REPO" --ref main
