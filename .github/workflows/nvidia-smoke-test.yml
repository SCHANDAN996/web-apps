name: NVIDIA API smoke test
on:
  push:
    branches: ['codex/nvidia-smoke-20261116-check']
permissions:
  contents: read
  statuses: write
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Test configured NVIDIA keys without exposing credentials
        id: probe
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_API_KEY_2: ${{ secrets.NVIDIA_API_KEY_2 }}
        shell: python
        run: |
          import json, os, time, urllib.request, urllib.error
          results = []
          for label, name in [('primary', 'NVIDIA_API_KEY'), ('secondary', 'NVIDIA_API_KEY_2')]:
              key = os.environ.get(name, '').strip()
              if not key:
                  results.append((label, 'not_configured'))
                  continue
              payload = {
                  'model': 'z-ai/glm-5.3',
                  'messages': [{'role': 'user', 'content': 'Reply with exactly OK. Do not explain.'}],
                  'max_tokens': 256, 'temperature': 0, 'stream': False,
              }
              request = urllib.request.Request(
                  'https://integrate.api.nvidia.com/v1/chat/completions',
                  json.dumps(payload).encode(),
                  {'Authorization': 'Bearer ' + key, 'Content-Type': 'application/json'},
              )
              started = time.monotonic()
              try:
                  with urllib.request.urlopen(request, timeout=75) as response:
                      value = json.loads(response.read(1024 * 1024))
                      choices = value.get('choices', [])
                      message = choices[0].get('message', {}) if choices else {}
                      content = message.get('content')
                      result = 'ok' if isinstance(content, str) and content.strip() else 'http200_no_final_text'
              except urllib.error.HTTPError as exc:
                  result = {401: 'auth_failed_401', 403: 'forbidden_403', 404: 'model_or_endpoint_404',
                            429: 'rate_limited_429'}.get(exc.code, 'http_' + str(exc.code))
              except (urllib.error.URLError, TimeoutError, OSError):
                  result = 'network_or_timeout'
              except Exception:
                  result = 'invalid_response'
              elapsed = round(time.monotonic() - started, 1)
              print(label + ': ' + result + ' (' + str(elapsed) + 's)', flush=True)
              results.append((label, result))
          summary = '; '.join(label + '=' + result for label, result in results)
          state = 'success' if results[0][1] == 'ok' and results[1][1] in ('ok', 'not_configured') else 'failure'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('summary=' + summary + '\nstate=' + state + '\n')
      - name: Publish safe test result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT_STATE: ${{ steps.probe.outputs.state }}
          RESULT_SUMMARY: ${{ steps.probe.outputs.summary }}
        run: |
          gh api --silent --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="${RESULT_STATE:-error}" -f context=nvidia-smoke-test \
            -f description="${RESULT_SUMMARY:-Test did not complete}" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          echo "${RESULT_SUMMARY:-Test did not complete}"
          test "$RESULT_STATE" = success
