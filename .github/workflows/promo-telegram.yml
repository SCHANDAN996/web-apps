# Study Station promotion — posts to the Telegram channel every day, straight from the book files.
# Slots (IST): 07:30 quiz · 12:30 trick · 18:00 quiz · 20:30 answers · Sunday 10:00 weekly test.
# GitHub drops or delays many scheduled runs, so this wakes every 30 minutes with --slot auto: each slot is
# posted once, at the first run inside its window (see WINDOWS in app/promo/__main__.py).
# Needs repository secrets TELEGRAM_BOT_TOKEN and TELEGRAM_CHANNEL_ID (@channelname); optional variable PROMO_LINK.
# Without the secrets every run is skipped (green), so nothing breaks before the channel exists.
# What went out is logged in study_station/promo/posted.json on the books branch (no repeats).
name: Promo Telegram

on:
  schedule:
    - cron: '7,37 * * * *'     # every 30 min → --slot auto
  workflow_dispatch:
    inputs:
      slot:
        description: 'auto | quiz | trick | revision | weekly'
        required: true
        default: quiz
      dry_run:
        description: 'only show what would be posted'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: promo-posted-log         # both promo workflows write study_station/promo/posted.json
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BOOKS_BRANCH: claude/elegant-rubin-sgov1q
    steps:
      - name: Which slot
        id: slot
        env:
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_SLOT: ${{ inputs.slot }}
        run: |
          if [ -n "$SCHEDULE" ]; then slot=auto; else slot="$INPUT_SLOT"; fi
          case "$slot" in auto|quiz|trick|revision|weekly) ;; *) echo "::error::unknown slot '$slot'"; exit 1 ;; esac
          echo "slot=$slot" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BOOKS_BRANCH }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: study_station/v2/requirements.txt
      - name: Install
        run: pip install -r study_station/v2/requirements.txt
      - name: Post ${{ steps.slot.outputs.slot }}
        working-directory: study_station/v2
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          PROMO_LINK: ${{ vars.PROMO_LINK }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          SLOT: ${{ steps.slot.outputs.slot }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python -m app.promo telegram --slot "$SLOT" --dry-run
          elif [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHANNEL_ID" ]; then
            echo "::notice::TELEGRAM_BOT_TOKEN / TELEGRAM_CHANNEL_ID secrets are not set yet — skipping."
          else
            python -m app.promo telegram --slot "$SLOT"
          fi
      - name: Save the posted-log
        if: always()
        run: |
          git config user.name "study-station-promo"
          git config user.email "211449723+SCHANDAN996@users.noreply.github.com"
          git add study_station/promo/posted.json 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -q -m "Promo: posted-log (${{ steps.slot.outputs.slot }})"
          for i in 1 2 3 4 5; do
            git pull -q --rebase origin "$BOOKS_BRANCH" && git push -q origin "HEAD:$BOOKS_BRANCH" && exit 0
            sleep $((i * 5))
          done
          echo "::error::could not push the posted-log"; exit 1
