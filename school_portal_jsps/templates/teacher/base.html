<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Teacher Portal{% endblock %} - JSPS</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/modern.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { margin:0; background: var(--bg-light); font-family:'Inter', sans-serif; }
        .topbar { background: var(--primary-dark); color:white; padding:14px 24px; display:flex; justify-content:space-between; align-items:center; }
        .topbar a { color:white; text-decoration:none; margin-left:16px; }
        .container { max-width:1180px; margin:28px auto; padding:0 20px; }
        .panel { background:white; border-radius:8px; padding:20px; box-shadow: var(--shadow-md); margin-bottom:20px; }
        .grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap:16px; }
        table { width:100%; border-collapse:collapse; }
        th, td { padding:10px; border-bottom:1px solid #eee; text-align:left; }
        .form-control { width:100%; padding:10px; border:1px solid #ddd; border-radius:5px; box-sizing:border-box; }
        .btn { background: var(--primary-color); color:white; border:0; border-radius:5px; padding:10px 14px; cursor:pointer; text-decoration:none; display:inline-block; }
        .alert { padding:12px; border-radius:6px; margin-bottom:16px; }
        .alert-success { background:#dcfce7; color:#166534; }
        .alert-error { background:#fee2e2; color:#991b1b; }
    </style>
</head>
<body>
    <div class="topbar">
        <strong><i class="fa-solid fa-chalkboard-user"></i> JSPS Teacher Portal</strong>
        <div>
            <a href="{{ url_for('teacher.dashboard') }}">Dashboard</a>
            <a href="{{ url_for('teacher.attendance') }}">Attendance</a>
            <a href="{{ url_for('teacher.assignments') }}">Assignments</a>
            <a href="{{ url_for('teacher.results') }}">Results</a>
            <a href="{{ url_for('auth.logout') }}">Logout</a>
        </div>
    </div>
    <div class="container">
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for category, message in messages %}
        <div class="alert alert-{{ category }}">{{ message }}</div>
        {% endfor %}
        {% endif %}
        {% endwith %}
        {% block teacher_content %}{% endblock %}
    </div>
</body>
</html>
