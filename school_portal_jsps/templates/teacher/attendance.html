{% extends 'teacher/base.html' %}
{% block title %}Attendance{% endblock %}
{% block teacher_content %}
<div class="panel">
    <h2 style="margin-top:0;">Mark Attendance</h2>
    <form method="GET" style="display:grid; grid-template-columns:1fr 1fr auto; gap:12px; align-items:end;">
        <div><label>Class</label><select name="class_name" class="form-control">{% for class_name in classes %}<option value="{{ class_name }}" {% if class_name == selected_class %}selected{% endif %}>{{ class_name }}</option>{% endfor %}</select></div>
        <div><label>Date</label><input type="date" name="attendance_date" value="{{ selected_date }}" class="form-control"></div>
        <button class="btn" type="submit">Load</button>
    </form>
</div>
<div class="panel">
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="hidden" name="class_name" value="{{ selected_class }}">
        <input type="hidden" name="attendance_date" value="{{ selected_date }}">
        <table>
            <thead><tr><th>Adm No</th><th>Name</th><th>Status</th><th>Remarks</th></tr></thead>
            <tbody>
            {% for student in students %}
            {% set record = records.get(student.id) %}
            <tr>
                <td>{{ student.admission_no }}</td>
                <td>{{ student.full_name }}</td>
                <td><select name="status_{{ student.id }}" class="form-control">{% for status in ['Present','Absent','Late','Leave'] %}<option {% if record and record.status == status %}selected{% endif %}>{{ status }}</option>{% endfor %}</select></td>
                <td><input name="remarks_{{ student.id }}" class="form-control" value="{{ record.remarks if record else '' }}"></td>
            </tr>
            {% endfor %}
            </tbody>
        </table>
        <button class="btn" style="margin-top:16px;" type="submit">Save</button>
    </form>
</div>
{% endblock %}
